name: Release Module

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in module.json
        run: |
          jq '.version = "${{ steps.version.outputs.version }}"' module.json > module.tmp
          mv module.tmp module.json

      - name: Build zip
        run: |
          zip -r curvy-walls.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitattributes" \
            -x ".gitignore" \
            -x ".DS_Store" \
            -x ".claude/*" \
            -x "*.zip"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            curvy-walls.zip
            module.json
          generate_release_notes: true
